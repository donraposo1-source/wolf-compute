name: Public Safe Canary
on:
  workflow_dispatch:
    inputs:
      mission_id: {required: true, type: string}
      fence: {required: true, type: string}
      source_repo: {required: true, type: string}
      source_sha: {required: true, type: string}
      workflow_sha: {required: true, type: string}
      binding_sha: {required: true, type: string}
permissions:
  contents: read
jobs:
  canary:
    if: github.repository == 'donraposo1-source/wolf-compute' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify public canary contract
        run: python3 -m unittest discover -s tests -v
      - name: Content-addressed public runner diagnostic only
        env:
          MISSION_ID: ${{ inputs.mission_id }}
          FENCE: ${{ inputs.fence }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          BINDING_SHA: ${{ inputs.binding_sha }}
          EUR_SPEND: '0'
          COST_UNKNOWN: DENY
          PAID_FALLBACK: DENY
          TRIAL_CREDIT: DENY
          UNVERIFIED_BILLING: DENY
          UNVERIFIED_PROVIDER: DENY
        run: |
          set -eu
          python3 scripts/public-safe-canary.py
